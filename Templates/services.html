<!DOCTYPE html>
<html>

<head>

    <title>Services - Hotel Resort Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🛎️ Services</h1>

        <p class="subtitle">
            Manage hotel services
        </p>


        <!-- Search Service -->

        <h2>Search Service</h2>

        <form method="GET" action="/services">

            <input type="text"
                   name="search"
                   placeholder="Search by Service ID or Service Name">

            <button type="submit">
                🔍 Search
            </button>

        </form>


        <br>


        <!-- Add New Service -->

        <h2>Add New Service</h2>

        <form method="POST" action="/add_service">

            <input type="text"
                   name="service_name"
                   placeholder="Service Name"
                   required>

            <br><br>


            <input type="text"
                   name="service_description"
                   placeholder="Service Description">

            <br><br>


            <input type="number"
                   name="service_price"
                   placeholder="Service Price"
                   step="0.01"
                   required>

            <br><br>


            <button type="submit">
                ➕ Add Service
            </button>

        </form>


        <br><br>


        <!-- Service Details -->

        <h2>Service Details</h2>

        <table border="1"
               cellpadding="10"
               cellspacing="0">

            <tr>

                <th>Service ID</th>

                <th>Service Name</th>

                <th>Description</th>

                <th>Price</th>

                <th>Actions</th>

            </tr>


            {% for service in services %}

            <tr>

                <td>{{ service[0] }}</td>

                <td>{{ service[1] }}</td>

                <td>{{ service[2] }}</td>

                <td>₹{{ service[3] }}</td>

                <td>

                    <a href="/update_service/{{ service[0] }}">
                        ✏️ Update
                    </a>

                    <br><br>

                    <a href="/delete_service/{{ service[0] }}"
                       onclick="return confirm('Are you sure you want to delete this service?');">
                        🗑️ Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>


        <br><br>


        <!-- Back to Home -->

        <a href="/" class="back-button">
            ← Back to Home
        </a>

    </div>

</body>

</html>
